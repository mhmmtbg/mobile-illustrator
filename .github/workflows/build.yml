name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew :core-model:test :io-svg:test :io-ai:test --stacktrace

      - name: APK derle
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK'yı adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mobile-illustrator-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-illustrator-apk
          path: dist/*.apk

      - name: Release yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" dist/*.apk \
            --target "${GITHUB_SHA}" \
            --title "Derleme ${VERSION_CODE}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
