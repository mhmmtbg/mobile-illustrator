name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: |
          set -o pipefail
          ./gradlew :core-model:test :io-svg:test :io-ai:test 2>&1 | tee -a build.log

      - name: APK derle
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee -a build.log

      # Hata satırlarını çalışmanın özetine not olarak düşer; log indirmeden okunabilir.
      - name: Hata özeti
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |^w: .*error|FAILED$|^\* What went wrong|^> |^\s+(at|Caused by) .*mobileillustrator|AssertionError|Unresolved|error:' build.log \
            | sed -e "s#file://${GITHUB_WORKSPACE}/##" | awk '!seen[$0]++' | head -n 60 > errors.txt || true
          [ -s errors.txt ] || tail -n 40 build.log > errors.txt
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Derleme hatası::${msg}"
          done

      - name: APK'yı adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mobile-illustrator-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-illustrator-apk
          path: dist/*.apk

      - name: Release yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" dist/*.apk \
            --target "${GITHUB_SHA}" \
            --title "Derleme ${VERSION_CODE}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
