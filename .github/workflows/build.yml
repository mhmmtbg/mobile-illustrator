name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: |
          set -o pipefail
          ./gradlew :core-model:test :io-svg:test :io-ai:test 2>&1 | tee -a build.log

      - name: APK derle
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee -a build.log

      # Hata satırlarını çalışmanın özetine not olarak düşer; log indirmeden okunabilir.
      - name: Hata özeti
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |^\* What went wrong|^> [^T]|^   > |^\s+(at|Caused by) .*mobileillustrator|AssertionError|Unresolved reference|error:|FAILED$' build.log \
            | grep -v '^> Task .* \(UP-TO-DATE\|FROM-CACHE\|SKIPPED\|NO-SOURCE\)$' \
            | sed -e "s#file://${GITHUB_WORKSPACE}/##" | awk '!seen[$0]++' | head -n 60 > errors.txt || true
          [ -s errors.txt ] || tail -n 40 build.log > errors.txt
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Derleme hatası::${msg}"
          done

      - name: APK'yı adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mobile-illustrator-${VERSION_CODE}.apk"
          # Birim testlerinin ürettiği 10.000 nesneli dosya: cihaz testinde performans ölçümü için
          cp io-ai/build/stress.ai dist/stress.ai || true

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-illustrator-apk
          path: |
            dist/*.apk
            dist/stress.ai

      - name: Release yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" dist/*.apk \
            --target "${GITHUB_SHA}" \
            --title "Derleme ${VERSION_CODE}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest

  # APK'yı emülatörde açıp temel akışı dener; ekran görüntülerini Release'e ekler.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mobile-illustrator-apk
          path: dist

      - name: KVM'i etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke.sh dist/mobile-illustrator-${{ github.run_number }}.apk shots

      - name: Ekran görüntülerini Release'e ekle
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ls shots/*.png > /dev/null 2>&1 || exit 0
          cp shots/ui.xml shots/ui.xml.txt 2>/dev/null || true
          gh release upload "build-${VERSION_CODE}" shots/*.png shots/*.txt $(ls shots/disa-aktarim.* 2>/dev/null | grep -v "\.png$" || true) --clobber
