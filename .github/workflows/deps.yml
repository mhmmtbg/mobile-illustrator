name: Geliştirme kitaplıkları

# Elle çalıştırılır: derleme sınıf yolunu "dev-deps" sürümüne yükler (yerelde hızlı derleme denetimi için).
on:
  workflow_dispatch:
  push:
    branches: [deps]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Sınıf yolunu topla
        run: |
          ./gradlew -I ci/dump-classpath.init.gradle.kts :app:dumpClasspath :desktop:dumpClasspath 2>&1 | tee dump.log || true
          mkdir -p build/deps
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true
          cp "$ANDROID_HOME/platforms/android-36/android.jar" build/deps/android.jar || true
          cp dump.log build/deps/
          (cd build && zip -qr ../dev-deps.zip deps)
          ls -la dev-deps.zip
      - name: Yükle
        run: |
          gh release view dev-deps > /dev/null 2>&1 || gh release create dev-deps --prerelease --title "Geliştirme kitaplıkları" --notes "Otomatik üretilir; uygulama sürümü değildir."
          gh release upload dev-deps dev-deps.zip --clobber
